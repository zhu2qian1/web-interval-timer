# main への push で GitHub Pages にデプロイする。
# リポジトリの Settings > Pages > Source は「GitHub Actions」にしておくこと。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise.toml の Node / pnpm をそのまま使う
      - uses: jdx/mise-action@v5

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

      # base_path は github.io なら "/web-interval-timer"、独自ドメイン設定後は "" になる
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm build --base "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
